services:
  nginx-proxy-manager:
    image: 'jc21/nginx-proxy-manager:latest'
    container_name: nginx-proxy-manager
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '81:81'
    volumes:
      - npm-data:/data
      - npm-letsencrypt:/etc/letsencrypt
    networks:
      - proxy-net

  uptime-monitoring:
    build: .
    container_name: uptime-monitoring
    restart: unless-stopped
    environment:
      PORT: '3300'
      TRUST_PROXY: '1'
    volumes:
      - uptime-data:/app/data
    networks:
      - proxy-net
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

networks:
  proxy-net:
    name: proxy-net

volumes:
  uptime-data:
  npm-data:
  npm-letsencrypt:
