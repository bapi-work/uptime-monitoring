<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>System Status</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="top">
    <div class="brand">
      <img data-brand-logo class="brand-logo" style="display:none" alt="" />
      <h1 id="page-title">System Status</h1>
    </div>
    <div style="display:flex; align-items:center; gap:12px;">
      <button class="secondary" id="theme-toggle" onclick="toggleTheme()" style="padding:6px 12px; font-size:16px; border:none; background:transparent;"></button>
      <a href="/">Admin dashboard &rarr;</a>
    </div>
  </header>

  <div class="container">
    <div id="page-nav" style="margin-bottom:16px; display:none;"></div>
    <p id="page-description" class="muted" style="display:none; margin-top:-10px;"></p>

    <div id="overall-banner"></div>

    <div class="panel" style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px;">
      <h2 style="margin:0;">History range</h2>
      <div class="range-toggle" id="range-toggle">
        <button data-range="hourly">Hourly</button>
        <button data-range="daily">Daily</button>
        <button data-range="7">7 Days</button>
        <button data-range="30" class="active">30 Days</button>
        <button data-range="45">45 Days</button>
        <button data-range="90">90 Days</button>
      </div>
    </div>

    <div id="monitors-list"></div>

    <div data-brand-footer class="brand-footer" style="display:none"></div>
  </div>

  <script src="/theme.js"></script>
  <script src="/branding.js"></script>
  <script src="/status.js"></script>
</body>
</html>
